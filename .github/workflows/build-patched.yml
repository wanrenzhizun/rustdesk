name: Build patched

# master only ever holds upstream + patches/ + .github/.
# Anything that must prove the patches still apply and still compile runs here.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: "Also build a portable Windows package"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-patched-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  verify-patches:
    name: Patches apply cleanly
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply every patch in order
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/*.patch)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::patches/ holds no patch"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            if ! git apply --3way --whitespace=nowarn "$f"; then
              echo "::error::failed to apply $f"
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "applied ${#files[@]} patch(es)"

  generate-bridge:
    name: Bridge
    uses: ./.github/workflows/bridge.yml

  check-windows:
    name: cargo check (x86_64-pc-windows-msvc)
    needs: [verify-patches, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Re-checkout with LF endings
        shell: bash
        # The patches are generated from the objects, so they carry LF. A CRLF worktree
        # makes every hunk mismatch, which is what a Windows runner does by default.
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
          git rm -r --cached . -q
          git reset --hard -q

      - name: Apply every patch in order
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/*.patch)
          for f in "${files[@]}"; do
            echo "::group::$f"
            if ! git apply --3way --whitespace=nowarn "$f"; then
              echo "::error::failed to apply $f"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Restore generated bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: check-patched

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: cargo check
        shell: bash
        run: cargo check --lib --features flutter

  package-windows-msi:
    name: Windows MSI (unsigned)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: [verify-patches, generate-bridge, check-windows]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Re-checkout with LF endings
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
          git rm -r --cached . -q
          git reset --hard -q

      - name: Apply every patch in order
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/*.patch)
          for f in "${files[@]}"; do
            git apply --3way --whitespace=nowarn "$f"
          done

      - name: Restore generated bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: package-msi

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Build the app bundle
        shell: bash
        run: python build.py --portable --flutter --skip-portable-pack --hwcodec

      - name: Assemble the payload for the installer
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find . -path "*windows*runner*Release*" -name rustdesk.exe -print -quit)
          if [ -z "$exe" ]; then
            echo "::error::rustdesk.exe not found"
            exit 1
          fi
          src=$(dirname "$exe")
          echo "payload: $src"
          rm -rf ./rustdesk && cp -r "$src" ./rustdesk
          ls ./rustdesk | head -20

      - name: Add the Windows drivers and extras the MSI ships
        shell: bash
        run: |
          set -euo pipefail
          # The MSI ships these next to the app; the flutter bundle does not carry them.
          for f in printer_driver_adapter.dll; do
            if [ -f "flutter/build/windows/x64/runner/Release/$f" ]; then
              cp "flutter/build/windows/x64/runner/Release/$f" ./rustdesk/
            fi
          done
          if [ -d ./usbmmidd_v2 ]; then cp -r ./usbmmidd_v2 ./rustdesk/; fi
          ls ./rustdesk | wc -l

      - name: Set up Python for the MSI preprocessor
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate the MSI
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          Write-Host "version=$version"
          pushd ./res/msi
          python preprocess.py -d ../../rustdesk -v $version
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          New-Item -ItemType Directory -Force -Path ./dist | Out-Null
          Copy-Item $msi.FullName "./dist/rustdesk-$version-x86_64.msi"
          Get-ChildItem ./dist

      - name: Upload the MSI
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x86_64-msi
          path: ./dist/*.msi
          if-no-files-found: error

  package-windows-portable:
    name: Portable package (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: [verify-patches, generate-bridge, check-windows]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Re-checkout with LF endings
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
          git rm -r --cached . -q
          git reset --hard -q

      - name: Apply every patch in order
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/*.patch)
          for f in "${files[@]}"; do
            git apply --3way --whitespace=nowarn "$f"
          done

      - name: Restore generated bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: package-patched

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Build portable
        shell: bash
        run: python build.py --portable --flutter --skip-portable-pack --hwcodec

      - name: Locate the built bundle
        shell: bash
        # build.py prints its paths relative to flutter/, so the real output lives under
        # flutter/build/windows/x64/runner/Release. Find it instead of hard-coding the prefix.
        run: |
          set -euo pipefail
          exe=$(find . -path "*windows*runner*Release*" -name rustdesk.exe -print -quit)
          if [ -z "$exe" ]; then
            echo "::error::rustdesk.exe not found; build output tree:"
            ls -la flutter/build 2>/dev/null || true
            exit 1
          fi
          dir=$(dirname "$exe")
          echo "bundle: $dir"
          ls -la "$dir" | head -30
          echo "BUNDLE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-portable
          path: ${{ env.BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 14

  package-linux-deb:
    name: Linux deb
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: [verify-patches, generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply every patch in order
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/*.patch)
          for f in "${files[@]}"; do
            git apply --3way --whitespace=nowarn "$f"
          done

      - name: Restore generated bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact-flutter-3.44
          path: ./

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # This is upstream's list; libunwind-dev must come first or libgstreamer1.0-dev
          # fails to configure and gstreamer-sys then has no pkg-config entry to find.
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm \
            ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: package-linux

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Build the app
        shell: bash
        run: python3 ./build.py --flutter --hwcodec --unix-file-copy-paste

      - name: Build the deb
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.+)".*/\1/')
          echo "version=$version"
          python3 ./build.py --package ./rustdesk --flutter --hwcodec --unix-file-copy-paste || true
          shopt -s nullglob
          debs=(*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::no .deb produced"
            ls -la | head -30
            exit 1
          fi
          mkdir -p ./dist && mv "${debs[@]}" ./dist/
          ls -la ./dist

      - name: Upload the deb
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-x86_64-deb
          path: ./dist/*.deb
          if-no-files-found: error
  package-android-apk:
    name: Android APK (self-signed)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: [verify-patches]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply every patch in order
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/*.patch)
          for f in "${files[@]}"; do
            git apply --3way --whitespace=nowarn "$f"
          done

      - name: Install Rust toolchain with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Install the Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Build the vendored Android libraries
        shell: bash
        # hwcodec's build.rs reads VCPKG_ROOT unconditionally, so the ffmpeg deps are built
        # for the target ABI before cargo runs. flutter/build_android_deps.sh does that.
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ./flutter/build_android_deps.sh arm64-v8a

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: package-android

      - name: Install the 32-bit C headers hwcodec's C++ needs
        shell: bash
        # hwcodec's build script compiles its C++ with the host toolchain, which needs
        # bits/libc-header-start.h from the i386 libc headers; upstream installs these too.
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386

      - name: Build the Rust library for arm64
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          # flutter/ndk_arm64.sh is the repo's own cross-compile entry point: cargo-ndk sets
          # CC/AR/linker for the target, which a hand-written linker var does not cover.
          cargo install cargo-ndk --version 3.1.2 --locked
          ./flutter/ndk_arm64.sh
          ls -la target/aarch64-linux-android/release/liblibrustdesk.so

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Stage the native library
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          dest=flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$dest/"
          cp target/aarch64-linux-android/release/liblibrustdesk.so "$dest/librustdesk.so"
          ls -la "$dest"

      - name: Set up the signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > flutter/android/rustdesk-fork.jks
          {
            echo "storePassword=${ANDROID_KEY_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=rustdesk-fork.jks"
          } > flutter/android/key.properties

      - name: Build the APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' flutter/android/gradle.properties || true
          cd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          ls -la build/app/outputs/flutter-apk/

      - name: Collect the APK
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.+)".*/\1/')
          mkdir -p ./dist
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "./dist/rustdesk-$version-arm64-v8a.apk"
          ls -la ./dist

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android-apk
          path: ./dist/*.apk
          if-no-files-found: error
  publish-release:
    name: Publish GitHub release
    # Publish whatever built; one broken platform should not hide the others.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: [package-windows-msi, package-linux-deb, package-android-apk]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download every package
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true
          pattern: rustdesk-*-{msi,deb,apk}

      - name: List what will be published
        shell: bash
        run: ls -la ./dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RustDesk ${{ steps.version.outputs.version }} (patched)
          body: |
            Built from `master` plus `patches/`, so it carries every patch in this repo.

            - Windows: `rustdesk-<version>-x86_64.msi` (unsigned; SmartScreen warns)
            - Linux: `rustdesk-<version>-x86_64.deb`
            - Android: `rustdesk-<version>-arm64-v8a.apk` (self-signed)
          files: ./dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
