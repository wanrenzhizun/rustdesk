name: Sync upstream

# Keeps master equal to upstream (plus patches/ + .github/) and rebases dev on
# top of it, then re-exports patches/. The only moments a human is needed are a
# non-fast-forward merge of upstream and a rebase conflict.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream master
        # master carries patches/ and .github/, so it is never a fast-forward of upstream.
        # A plain merge keeps those commits and only conflicts where upstream touched the same
        # lines, which the patch build will catch again right after this workflow pushes.
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/rustdesk/rustdesk.git || true
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "already up to date with upstream"
            exit 0
          fi
          if ! git merge --no-edit upstream/master; then
            echo "::error::master does not merge cleanly with upstream/master; a human has to resolve it"
            git merge --abort || true
            exit 1
          fi

      - name: Rebase dev onto master
        run: |
          set -euo pipefail
          git checkout dev
          git rebase master || {
            echo "::error::dev does not rebase cleanly onto master; resolve it locally with 'git rebase --continue'"
            git rebase --abort || true
            exit 1
          }

      - name: Re-export patches
        run: |
          set -euo pipefail
          git checkout master
          rm -f patches/*.patch
          git format-patch master..dev -o patches -- . ':(exclude).github' ':(exclude)patches' >/dev/null
          ls -1 patches

      - name: Commit patches
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain patches)" ]; then
            echo "patches unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add patches
          git commit -m "chore(patches): re-export from dev@$(git rev-parse --short dev)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push
        run: |
          set -euo pipefail
          git push origin master
          git push --force-with-lease origin dev
